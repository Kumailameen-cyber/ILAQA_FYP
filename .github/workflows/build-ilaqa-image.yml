
name: Build and Deploy ILAQA Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/build-ilaqa-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ilaqa-backend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kumailameen-cyber/ilaqa-api-test:latest
            ghcr.io/kumailameen-cyber/ilaqa-api-test:${{ github.sha }}

      - name: Login to Azure securely
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy new image to Azure
        run: |
          az containerapp update \
            --name ilaqa-api-test \
            --resource-group DefaultResourceGroup-SEA \
            --image "ghcr.io/kumailameen-cyber/ilaqa-api-test:${GITHUB_SHA}"

      - name: Verify deployed image
        run: |
          az containerapp show \
            --name ilaqa-api-test \
            --resource-group DefaultResourceGroup-SEA \
            --query "properties.template.containers[0].image" \
            -o tsv
